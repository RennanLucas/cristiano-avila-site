name: Commit Next.js migration lockfile
on:
  push:
    branches: [upgrade/next15-integrado]
    paths: [.github/workflows/lockfile-migration.yml]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade/next15-integrado'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only package-lock.json to migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "chore: commit generated Next.js 15 lockfile"
          gh auth setup-git
          git push origin HEAD:refs/heads/upgrade/next15-integrado
